[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traider"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ib_async>=1.0",
    "pydantic>=2.0",
    "structlog>=24.0",
    "rich>=13.0",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
    "hypothesis>=6.0",
]

[project.scripts]
trading-bot = "bot.cli.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.mypy]
strict = true
python_version = "3.13"
exclude = ["tests/"]
mypy_path = "src"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "PT"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov-report=term-missing"
